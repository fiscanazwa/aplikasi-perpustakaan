<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku</title>
</head>
<body>
<h1>Daftar Buku</h1>
<a th:href="@{/anggota}">Lihat Anggota</a>

<form th:action="@{/buku}" method="get">
    <input name="kata" th:value="${kata}" placeholder="Cari judul">
    <button type="submit">Cari</button>
</form>

<table border="1">
    <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul buku</td>
        <td th:text="${b.stok}">0</td>
    </tr>
</table>


<h2>Tambah Buku</h2>

<form th:action="@{/buku}" method="post">
    <input type="text"
           name="idBuku"
           placeholder="ID Buku"
           maxlength="10"
           required>

    <input type="text"
           name="judul"
           placeholder="Judul Buku"
           maxlength="200"
           required>

    <input type="number"
           name="stok"
           placeholder="Stok"
           min="0"
           value="1"
           required>

    <button type="submit">Simpan</button>
</form>
</body>
</html>
